<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - Training Day</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .date-selector {
            background: #28a745;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        .date-selector h3 {
            margin-bottom: 15px;
        }
        .date-selector select {
            padding: 12px 15px;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            max-width: 400px;
            font-weight: 600;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 5px;
        }
        .attendance-section {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .attendance-section h3 {
            color: #856404;
            margin-bottom: 15px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .checkbox-item:hover {
            border-color: #28a745;
            background: #f0fff4;
        }
        .checkbox-item.checked {
            border-color: #28a745;
            background: #d4edda;
        }
        .checkbox-item input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #28a745;
        }
        .member-info {
            flex: 1;
            cursor: pointer;
        }
        .member-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }
        .member-details {
            color: #666;
            font-size: 13px;
            margin-top: 3px;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 5px;
        }
        .badge-expected {
            background: #e7f3ff;
            color: #1976D2;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 22px;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="nav.js" defer></script>
</head>
<body class="sh sh-staff">
    <div class="container">
        <div class="header">
            <div>
                <h1>✅ Mark Attendance</h1>
                <p style="color: #666; margin-top: 5px;">Check who actually attended training</p>
            </div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="saveAttendance()">💾 Save Attendance</button>
                <button class="btn btn-primary" onclick="refreshData()">🔄 Refresh</button>
                <span id="lastUpdated" style="margin-left: 12px; font-size: 13px; color: #666;"></span>
            </div>
        </div>
 
        <div class="date-selector">
            <h3>📅 Select Training Date</h3>
            <select id="trainingDaySelect" onchange="loadExpectedMembers()">
                <option value="">-- Select today's training date --</option>
            </select>
        </div>
 
        <div class="stats" id="stats" style="display: none;">
            <!-- Stats will be populated -->
        </div>
 
        <div class="attendance-section" id="attendanceSection" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h3 style="margin: 0;">📝 Mark Who Attended</h3>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="selectAll()" style="padding: 8px 16px; font-size: 13px;">✅ Select All</button>
                    <button class="btn btn-primary" onclick="deselectAll()" style="padding: 8px 16px; font-size: 13px; background: #dc3545;">❌ Clear All</button>
                </div>
            </div>
            <p style="color: #856404; margin-bottom: 15px; font-size: 14px;">
                ✓ Check the boxes for members who actually attended training
            </p>
            <div id="attendanceList">
                <!-- Checkboxes will be populated here -->
            </div>
        </div>
 
        <div class="empty-state" id="emptyState">
            <div style="font-size: 64px; margin-bottom: 20px;">📋</div>
            <h3>Select a training date</h3>
            <p>Choose today's training date to mark attendance</p>
        </div>
    </div>
 
    <script src="sync.js"></script>
    <script>
        let allResponses = [];
        let memberDatabase = [];
        let trainingDates = [];
        let selectedDate = '';
 
        let sharedAttendance = [];
        let rosterMap = {};
        let dirty = false; // true when ticks have changed since the last load/save
        const norm = v => String(v || '').trim().toLowerCase();

        document.addEventListener('DOMContentLoaded', async function() {
            await loadRoster();
            await refreshData(true);
        });

        // roster.json is the source of truth for category / side / gender
        async function loadRoster() {
            try {
                const r = await fetch('roster.json', { cache: 'no-store' });
                if (r.ok) {
                    const d = await r.json();
                    (d.members || []).forEach(m => { rosterMap[norm(m.name)] = m; });
                }
            } catch (e) {
                console.warn('roster.json not loaded:', e);
            }
        }

        // Newest response per person per week, details filled from the roster
        function cleanResponses(list) {
            const latest = {};
            list.forEach(r => {
                if (!r.name || !Array.isArray(r.days)) return;
                const key = norm(r.name) + '_' + r.weekStart;
                if (!latest[key] || String(r.timestamp) > String(latest[key].timestamp)) latest[key] = r;
            });
            return Object.values(latest).map(r => {
                const m = rosterMap[norm(r.name)];
                return Object.assign({}, r, {
                    days: r.days.filter(d => norm(d.name) !== 'thursday - land'), // Thursday land training was removed
                    category: (m && m.category) || r.category,
                    paddlingSide: String((m && m.paddlingSide) || r.paddlingSide || '').trim(),
                    gender: (m && m.gender) || r.gender
                });
            });
        }

        async function loadData() {
            let list;
            let note = '';
            try {
                const all = await SeahawkSync.fetchAll({ force: true });
                list = all.availability;
                sharedAttendance = all.attendance;
                if (all.roster && all.roster.length) {   // live Roster tab wins over roster.json
                    rosterMap = {};
                    all.roster.forEach(m => { rosterMap[norm(m.name)] = m; });
                }
            } catch (e) {
                console.warn('Sheet unavailable, using this device only:', e);
                list = JSON.parse(localStorage.getItem('weeklyAvailability') || '[]');
                sharedAttendance = JSON.parse(localStorage.getItem('actualAttendance') || '[]');
                note = ' (offline - this device only)';
            }
            allResponses = cleanResponses(list);

            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 14);
            cutoff.setHours(0, 0, 0, 0);

            const dateSet = new Map();
            allResponses.forEach(response => {
                response.days.forEach(day => {
                    if (new Date(day.date) < cutoff) return;
                    if (!dateSet.has(day.date)) {
                        dateSet.set(day.date, { date: day.date, name: day.name, display: day.display });
                    }
                });
            });

            trainingDates = Array.from(dateSet.values()).sort((a, b) =>
                new Date(a.date) - new Date(b.date)
            );

            document.getElementById('lastUpdated').textContent =
                'Updated ' + new Date().toLocaleTimeString('en-SG') + note;
        }

        function populateTrainingDaySelector() {
            const select = document.getElementById('trainingDaySelect');
 
            if (trainingDates.length === 0) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = '-- No training days scheduled --';
                select.appendChild(option);
                return;
            }
 
            trainingDates.forEach(dateInfo => {
                const count = allResponses.filter(r =>
                    r.days.some(d => d.date === dateInfo.date)
                ).length;
 
                const option = document.createElement('option');
                option.value = dateInfo.date;
                option.textContent = `${dateInfo.name}, ${dateInfo.display} (${count} expected)`;
                select.appendChild(option);
            });
        }
 
        function loadExpectedMembers() {
            selectedDate = document.getElementById('trainingDaySelect').value;
 
            if (!selectedDate) {
                document.getElementById('stats').style.display = 'none';
                document.getElementById('attendanceSection').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }
 
            // Get members who said they'd come
            const expectedMembers = allResponses.filter(r =>
                r.days.some(d => d.date === selectedDate)
            );
 
            if (expectedMembers.length === 0) {
                document.getElementById('stats').style.display = 'none';
                document.getElementById('attendanceSection').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }
 
            // Sort by name
            expectedMembers.sort((a, b) => a.name.localeCompare(b.name));
 
            // Load any previously saved attendance for this date
            const savedAttendance = sharedAttendance;
            const todayAttendance = savedAttendance.find(a => a.date === selectedDate);
            const attendedNames = todayAttendance ? new Set(todayAttendance.attended) : new Set();
 
            // Display attendance list
            const container = document.getElementById('attendanceList');
            container.innerHTML = '';
 
            expectedMembers.forEach((member, index) => {
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                if (attendedNames.has(member.name)) {
                    div.classList.add('checked');
                }
 
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `member-${index}`;
                checkbox.value = member.name;
                checkbox.checked = attendedNames.has(member.name);
                checkbox.onchange = function() {
                    updateCheckboxStyle(this);
                    updateStats();
                };
 
                const memberInfo = document.createElement('div');
                memberInfo.className = 'member-info';
                memberInfo.onclick = function() {
                    checkbox.checked = !checkbox.checked;
                    updateCheckboxStyle(checkbox);
                    updateStats();
                };
 
                const nameDiv = document.createElement('div');
                nameDiv.className = 'member-name';
                nameDiv.textContent = member.name;
 
                const detailsDiv = document.createElement('div');
                detailsDiv.className = 'member-details';
                detailsDiv.innerHTML = `
                    <span class="badge badge-expected">Expected</span>
                    ${member.category} | ${member.paddlingSide || 'Not specified'}
                `;
 
                memberInfo.appendChild(nameDiv);
                memberInfo.appendChild(detailsDiv);
 
                div.appendChild(checkbox);
                div.appendChild(memberInfo);
 
                container.appendChild(div);
            });
 
            updateStats();
 
            dirty = false;
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('attendanceSection').style.display = 'block';
            document.getElementById('emptyState').style.display = 'none';
        }
 
        function updateCheckboxStyle(checkbox) {
            const container = checkbox.closest('.checkbox-item');
            if (checkbox.checked) {
                container.classList.add('checked');
            } else {
                container.classList.remove('checked');
            }
        }
 
        function selectAll() {
            const checkboxes = document.querySelectorAll('#attendanceList input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = true;
                updateCheckboxStyle(cb);
            });
            updateStats();
        }
 
        function deselectAll() {
            const checkboxes = document.querySelectorAll('#attendanceList input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = false;
                updateCheckboxStyle(cb);
            });
            updateStats();
        }
 
        function updateStats() {
            dirty = true;
            const checkboxes = document.querySelectorAll('#attendanceList input[type="checkbox"]');
            const total = checkboxes.length;
            const attended = Array.from(checkboxes).filter(cb => cb.checked).length;
            const absent = total - attended;
            const rate = total > 0 ? Math.round((attended / total) * 100) : 0;
 
            const statsHtml = `
                <div class="stat-card" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">
                    <div class="stat-number">${attended}</div>
                    <div class="stat-label">Attended</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);">
                    <div class="stat-number">${absent}</div>
                    <div class="stat-label">Absent</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <div class="stat-number">${total}</div>
                    <div class="stat-label">Expected</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                    <div class="stat-number">${rate}%</div>
                    <div class="stat-label">Attendance Rate</div>
                </div>
            `;
 
            document.getElementById('stats').innerHTML = statsHtml;
        }
 
        async function saveAttendance() {
            if (!selectedDate) {
                alert('⚠️ Please select a training date first!');
                return;
            }

            const checkboxes = document.querySelectorAll('#attendanceList input[type="checkbox"]');
            const attendedMembers = Array.from(checkboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);

            if (attendedMembers.length === 0) {
                if (!confirm('⚠️ No one is marked as attended. Save anyway?')) {
                    return;
                }
            }

            const attendedDetails = attendedMembers.map(name => {
                const response = allResponses.find(r => r.name === name) || {};
                return {
                    name: name,
                    category: response.category || '',
                    paddlingSide: response.paddlingSide || '',
                    gender: response.gender || ''
                };
            });

            const dayInfo = trainingDates.find(d => d.date === selectedDate);
            const record = {
                date: selectedDate,
                dayName: dayInfo.name,
                display: dayInfo.display,
                attended: attendedMembers,
                attendedDetails: attendedDetails,
                timestamp: new Date().toISOString()
            };

            // Local backup on this device
            let localAttendance = JSON.parse(localStorage.getItem('actualAttendance') || '[]');
            localAttendance = localAttendance.filter(a => a.date !== selectedDate);
            localAttendance.push(record);
            localStorage.setItem('actualAttendance', JSON.stringify(localAttendance));

            // Save to the shared sheet and confirm
            try {
                const result = await SeahawkSync.post(Object.assign({ action: 'attendance' }, record));
                sharedAttendance = result.attendance || sharedAttendance;
                dirty = false;
                alert(`✅ Attendance saved to the shared sheet!\n\n📅 ${dayInfo.name}, ${dayInfo.display}\n👥 ${attendedMembers.length} members marked as attended`);
            } catch (e) {
                console.error('Attendance save failed:', e);
                alert('⚠️ NOT saved to the shared sheet (check internet / script URL).\n\nA copy is kept on this device only. Please press Save again when online.');
            }
        }

        async function refreshData(initial) {
            if (initial !== true && dirty && !confirm('You have unsaved changes. Refresh and discard them?')) {
                return;
            }
            const select = document.getElementById('trainingDaySelect');
            const currentDate = select.value;

            await loadData();

            select.innerHTML = '<option value="">-- Select today\'s training date --</option>';
            populateTrainingDaySelector();

            if (currentDate && trainingDates.some(d => d.date === currentDate)) {
                select.value = currentDate;
                loadExpectedMembers();
            }
        }
    </script>
</body>
</html>
