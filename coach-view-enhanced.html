
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach View - Boat Arrangement</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            font-size: 18px; /* Larger base font for seniors */
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 36px; /* Larger for seniors */
            font-weight: 700;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .date-selector {
            background: #667eea;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        .date-selector h3 {
            margin-bottom: 15px;
        }
        .date-selector select {
            padding: 12px 15px;
            border: 2px solid white;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            max-width: 400px;
            font-weight: 600;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-section {
            background: #e7f3ff;
            border: 2px solid #2196F3;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .filter-section h3 {
            color: #1976D2;
            margin-bottom: 15px;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .filter-group {
            background: white;
            padding: 15px;
            border-radius: 8px;
        }
        .filter-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .filter-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 5px;
        }
        .boat-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
        }
        .boat-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }
        .side-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border: 3px solid #667eea;
        }
        .side-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 24px; /* Larger for seniors */
            margin-bottom: 20px;
        }
        .paddler-row {
            background: #f8f9fa;
            padding: 18px;
            margin-bottom: 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 6px solid #667eea;
            transition: all 0.3s;
        }
        .paddler-row:hover {
            background: #e7f3ff;
            transform: translateX(5px);
        }
        .position-number {
            background: #667eea;
            color: white;
            width: 50px; /* Larger for seniors */
            height: 50px; /* Larger for seniors */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px; /* Larger for seniors */
            flex-shrink: 0;
        }
        .paddler-info {
            flex: 1;
        }
        .paddler-name {
            font-weight: 700;
            color: #333;
            font-size: 20px; /* Larger for seniors */
            margin-bottom: 6px;
        }
        .paddler-details {
            color: #666;
            font-size: 16px; /* Larger for seniors */
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 5px;
        }
        .badge-premier {
            background: #ffd700;
            color: #856404;
        }
        .badge-senior {
            background: #c0c0c0;
            color: #383d41;
        }
        .badge-female {
            background: #fce4ec;
            color: #c2185b;
        }
        .badge-male {
            background: #e3f2fd;
            color: #1976D2;
        }
        .empty-side {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        @media (max-width: 1024px) {
            .boat-layout {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
                font-size: 16px;
            }
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 28px; /* Larger for seniors */
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .btn {
                width: 100%;
                font-size: 18px; /* Larger for seniors */
                padding: 16px;
            }
            .filter-grid {
                grid-template-columns: 1fr;
            }
            /* Keep left/right layout visible on mobile */
            .boat-layout {
                gap: 20px;
            }
            .side-section {
                padding: 15px;
            }
            .side-header {
                font-size: 22px; /* Maintain large size on mobile */
                padding: 15px;
            }
            .paddler-row {
                padding: 14px;
                font-size: 16px;
            }
            .position-number {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
            .paddler-name {
                font-size: 18px;
            }
            .paddler-details {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🚣 Coach View - Boat Arrangement</h1>
                <p style="color: #666; margin-top: 5px;">Visual seating with filters</p>
            </div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="exportToExcel()">📥 Export to Excel</button>
                <button class="btn btn-primary" onclick="refreshData()">🔄 Refresh</button>
            </div>
        </div>
 
        <div class="date-selector">
            <h3>📅 Select Training Date</h3>
            <select id="trainingDaySelect" onchange="loadMembers()">
                <option value="">-- Select a training day --</option>
            </select>
        </div>
 
        <div class="filter-section" id="filterSection" style="display: none;">
            <h3>🎯 Filters</h3>
            <div class="filter-grid">
                <div class="filter-group">
                    <label>Gender</label>
                    <select id="genderFilter" onchange="applyFilters()">
                        <option value="all">All</option>
                        <option value="female">Ladies Only 👩</option>
                        <option value="male">Gents Only 👨</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Category</label>
                    <select id="categoryFilter" onchange="applyFilters()">
                        <option value="all">All Categories</option>
                        <option value="premier">Premier</option>
                        <option value="senior a">Senior A</option>
                        <option value="senior b">Senior B</option>
                        <option value="senior c">Senior C</option>
                        <option value="master">Master</option>
                        <option value="a">Category A</option>
                        <option value="b">Category B</option>
                        <option value="c">Category C</option>
                    </select>
                </div>
            </div>
        </div>
 
        <div class="stats" id="stats" style="display: none;">
            <!-- Stats will be populated -->
        </div>
 
        <div class="boat-container" id="boatContainer" style="display: none;">
            <h2 style="text-align: center; color: #333; margin-bottom: 20px;">🚣 Boat Seating Arrangement</h2>
            <div class="boat-layout">
                <div class="side-section">
                    <div class="side-header">⬅️ LEFT SIDE</div>
                    <div id="leftSide">
                        <!-- Left paddlers will be populated here -->
                    </div>
                </div>
                <div class="side-section">
                    <div class="side-header">RIGHT SIDE ➡️</div>
                    <div id="rightSide">
                        <!-- Right paddlers will be populated here -->
                    </div>
                </div>
            </div>
        </div>
 
        <div class="empty-state" id="emptyState">
            <div style="font-size: 64px; margin-bottom: 20px;">📭</div>
            <h3>Select a training date</h3>
            <p>Choose a training date above to see the boat arrangement</p>
        </div>
    </div>
 
    <script src=https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js></script>
    <script>
        let allResponses = [];
        let trainingDates = [];
        let allMembers = [];
        let filteredMembers = [];
 
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            populateTrainingDaySelector();
        });
 
        function loadData() {
            allResponses = JSON.parse(localStorage.getItem('weeklyAvailability') || '[]');
 
            const dateSet = new Map();
            allResponses.forEach(response => {
                response.days.forEach(day => {
                    if (!dateSet.has(day.date)) {
                        dateSet.set(day.date, {
                            date: day.date,
                            name: day.name,
                            display: day.display
                        });
                    }
                });
            });
 
            trainingDates = Array.from(dateSet.values()).sort((a, b) =>
                new Date(a.date) - new Date(b.date)
            );
        }
 
        function populateTrainingDaySelector() {
            const select = document.getElementById('trainingDaySelect');
 
            if (trainingDates.length === 0) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = '-- No training days available --';
                select.appendChild(option);
                return;
            }
 
            trainingDates.forEach(dateInfo => {
                const count = allResponses.filter(r =>
                    r.days.some(d => d.date === dateInfo.date)
                ).length;
 
                const option = document.createElement('option');
                option.value = dateInfo.date;
                option.textContent = `${dateInfo.name}, ${dateInfo.display} (${count} people)`;
                select.appendChild(option);
            });
        }
 
        function loadMembers() {
            const selectedDate = document.getElementById('trainingDaySelect').value;
 
            if (!selectedDate) {
                document.getElementById('filterSection').style.display = 'none';
                document.getElementById('stats').style.display = 'none';
                document.getElementById('boatContainer').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }
 
            allMembers = allResponses.filter(r =>
                r.days.some(d => d.date === selectedDate)
            );
 
            if (allMembers.length === 0) {
                document.getElementById('filterSection').style.display = 'none';
                document.getElementById('stats').style.display = 'none';
                document.getElementById('boatContainer').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }
 
            // Sort by name
            allMembers.sort((a, b) => a.name.localeCompare(b.name));
 
            // Reset filters
            document.getElementById('genderFilter').value = 'all';
            document.getElementById('categoryFilter').value = 'all';
 
            document.getElementById('filterSection').style.display = 'block';
            document.getElementById('emptyState').style.display = 'none';
 
            applyFilters();
        }
 
        function applyFilters() {
            const genderFilter = document.getElementById('genderFilter').value;
            const categoryFilter = document.getElementById('categoryFilter').value;
 
            filteredMembers = allMembers.filter(member => {
                // Gender filter
                if (genderFilter !== 'all') {
                    const gender = String(member.gender || '').toLowerCase();
                    if (genderFilter === 'female' && !gender.includes('female')) return false;
                    if (genderFilter === 'male' && !gender.includes('male')) return false;
                }
 
                // Category filter
                if (categoryFilter !== 'all') {
                    const category = String(member.category || '').toLowerCase();
                    if (!category.includes(categoryFilter)) return false;
                }
 
                return true;
            });
 
            displayBoatArrangement();
            updateStats();
        }
 
        function displayBoatArrangement() {
            // Separate by paddling side
            const leftPaddlers = filteredMembers.filter(m =>
                String(m.paddlingSide || '').toLowerCase().includes('left')
            );
 
            const rightPaddlers = filteredMembers.filter(m =>
                String(m.paddlingSide || '').toLowerCase().includes('right')
            );
 
            const unspecified = filteredMembers.filter(m => {
                const side = String(m.paddlingSide || '').toLowerCase();
                return !side.includes('left') && !side.includes('right');
            });
 
            // Display left side
            const leftSide = document.getElementById('leftSide');
            leftSide.innerHTML = '';
 
            if (leftPaddlers.length === 0) {
                leftSide.innerHTML = '<div class="empty-side">No paddlers on left side</div>';
            } else {
                leftPaddlers.forEach((member, index) => {
                    leftSide.appendChild(createPaddlerRow(member, index + 1));
                });
            }
 
            // Display right side
            const rightSide = document.getElementById('rightSide');
            rightSide.innerHTML = '';
 
            if (rightPaddlers.length === 0) {
                rightSide.innerHTML = '<div class="empty-side">No paddlers on right side</div>';
            } else {
                rightPaddlers.forEach((member, index) => {
                    rightSide.appendChild(createPaddlerRow(member, index + 1));
                });
            }
 
            // Show unspecified if any
            if (unspecified.length > 0) {
                const unspecifiedDiv = document.createElement('div');
                unspecifiedDiv.style.gridColumn = '1 / -1';
                unspecifiedDiv.style.marginTop = '20px';
                unspecifiedDiv.innerHTML = `
                    <div style="background: #fff3cd; border: 2px solid #ffc107; border-radius: 10px; padding: 20px;">
                        <h3 style="color: #856404; margin-bottom: 15px;">⚠️ Paddling Side Not Specified (${unspecified.length})</h3>
                        <div id="unspecifiedList"></div>
                    </div>
                `;
                document.querySelector('.boat-layout').appendChild(unspecifiedDiv);
 
                const unspecifiedList = document.getElementById('unspecifiedList');
                unspecified.forEach((member, index) => {
                    const row = createPaddlerRow(member, index + 1);
                    row.style.borderLeft = '5px solid #ffc107';
                    unspecifiedList.appendChild(row);
                });
            }
 
            document.getElementById('boatContainer').style.display = 'block';
        }
 
        function createPaddlerRow(member, position) {
            const row = document.createElement('div');
            row.className = 'paddler-row';
 
            const positionDiv = document.createElement('div');
            positionDiv.className = 'position-number';
            positionDiv.textContent = position;
 
            const infoDiv = document.createElement('div');
            infoDiv.className = 'paddler-info';
 
            const nameDiv = document.createElement('div');
            nameDiv.className = 'paddler-name';
            nameDiv.textContent = member.name;
 
            const detailsDiv = document.createElement('div');
            detailsDiv.className = 'paddler-details';
 
            // Category badge
            let categoryBadge = 'badge-premier';
            const cat = String(member.category || '').toLowerCase();
            if (cat.includes('premier')) categoryBadge = 'badge-premier';
            else if (cat.includes('senior') || cat.includes('b') || cat.includes('c')) categoryBadge = 'badge-senior';
 
            // Gender badge
            let genderBadge = '';
            const gender = String(member.gender || '').toLowerCase();
            if (gender.includes('female')) {
                genderBadge = '<span class="badge badge-female">👩 F</span>';
            } else if (gender.includes('male')) {
                genderBadge = '<span class="badge badge-male">👨 M</span>';
            }
 
            detailsDiv.innerHTML = `
                <span class="badge ${categoryBadge}">${member.category}</span>
                ${genderBadge}
            `;
 
            infoDiv.appendChild(nameDiv);
            infoDiv.appendChild(detailsDiv);
 
            row.appendChild(positionDiv);
            row.appendChild(infoDiv);
 
            return row;
        }
 
        function updateStats() {
            const total = filteredMembers.length;
            const leftCount = filteredMembers.filter(m =>
                String(m.paddlingSide || '').toLowerCase().includes('left')
            ).length;
            const rightCount = filteredMembers.filter(m =>
                String(m.paddlingSide || '').toLowerCase().includes('right')
            ).length;
            const ladies = filteredMembers.filter(m =>
                String(m.gender || '').toLowerCase().includes('female')
            ).length;
            const gents = filteredMembers.filter(m =>
                String(m.gender || '').toLowerCase().includes('male') &&
                !String(m.gender || '').toLowerCase().includes('female')
            ).length;
 
            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-number">${total}</div>
                    <div class="stat-label">Total Paddlers</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                    <div class="stat-number">${leftCount}</div>
                    <div class="stat-label">Left Side</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <div class="stat-number">${rightCount}</div>
                    <div class="stat-label">Right Side</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #fce4ec 0%, #c2185b 100%);">
                    <div class="stat-number">${ladies}</div>
                    <div class="stat-label">Ladies</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #e3f2fd 0%, #1976D2 100%);">
                    <div class="stat-number">${gents}</div>
                    <div class="stat-label">Gents</div>
                </div>
            `;
 
            document.getElementById('stats').innerHTML = statsHtml;
            document.getElementById('stats').style.display = 'grid';
        }
 
        function refreshData() {
            loadData();
            const currentDate = document.getElementById('trainingDaySelect').value;
 
            const select = document.getElementById('trainingDaySelect');
            select.innerHTML = '<option value="">-- Select a training day --</option>';
            populateTrainingDaySelector();
 
            if (currentDate) {
                select.value = currentDate;
                loadMembers();
            }
        }
 
        function exportToExcel() {
            const selectedDate = document.getElementById('trainingDaySelect').value;
 
            if (!selectedDate || filteredMembers.length === 0) {
                alert('⚠️ Please select a training day and ensure there are members to export!');
                return;
            }
 
            const dayInfo = trainingDates.find(d => d.date === selectedDate);
            const genderFilter = document.getElementById('genderFilter').value;
            const categoryFilter = document.getElementById('categoryFilter').value;
 
            let filterLabel = [];
            if (genderFilter === 'female') filterLabel.push('Ladies Only');
            if (genderFilter === 'male') filterLabel.push('Gents Only');
            if (categoryFilter !== 'all') filterLabel.push(categoryFilter.toUpperCase());
 
            const filterText = filterLabel.length > 0 ? ` (${filterLabel.join(', ')})` : '';
 
            // Separate by side
            const leftPaddlers = filteredMembers.filter(m =>
                String(m.paddlingSide || '').toLowerCase().includes('left')
            );
            const rightPaddlers = filteredMembers.filter(m =>
                String(m.paddlingSide || '').toLowerCase().includes('right')
            );
 
            // Prepare Excel data
            const data = [
                [`BOAT ARRANGEMENT - ${dayInfo.name}, ${dayInfo.display}${filterText}`],
                ['Generated:', new Date().toLocaleString('en-SG')],
                ['Total Paddlers:', filteredMembers.length],
                [''],
                ['LEFT SIDE', '', '', ''],
                ['Position', 'Name', 'Category', 'Gender']
            ];
 
            leftPaddlers.forEach((member, index) => {
                data.push([
                    index + 1,
                    member.name,
                    member.category,
                    member.gender || 'Not specified'
                ]);
            });
 
            data.push(['']);
            data.push(['RIGHT SIDE', '', '', '']);
            data.push(['Position', 'Name', 'Category', 'Gender']);
 
            rightPaddlers.forEach((member, index) => {
                data.push([
                    index + 1,
                    member.name,
                    member.category,
                    member.gender || 'Not specified'
                ]);
            });
 
            // Create worksheet
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [
                {wch: 10},
                {wch: 25},
                {wch: 15},
                {wch: 12}
            ];
 
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Boat Arrangement');
 
            const fileName = `Boat_Arrangement_${selectedDate}${filterLabel.length > 0 ? '_' + filterLabel.join('_').replace(/ /g, '_') : ''}.xlsx`;
            XLSX.writeFile(wb, fileName);
 
            alert(`✅ Excel exported!\n\n${dayInfo.name}, ${dayInfo.display}${filterText}\n🚣 ${filteredMembers.length} paddlers\n⬅️ ${leftPaddlers.length} left | ${rightPaddlers.length} right ➡️`);
        }
    </script>
</body>
</html>
